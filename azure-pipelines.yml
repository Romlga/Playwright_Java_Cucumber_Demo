parameters:
  - name: cucumberTag
    type: string
    default: '@Teil1'
  - name: runId
    type: string
    default: ''

trigger:
  branches:
    include:
      - main
      - demo_with_yml

pool:
  name: RestAPI-Service-vm-pool

variables:
  TEST_PROJECT_PATH: '$(Pipeline.Workspace)/Playwright Java Cucumber'


steps:
  - checkout: self
    displayName: 'Checkout code'

  - script: mvn --version
    displayName: 'Show Maven and Java version'

  - script: mvn clean install -DskipTests
    displayName: 'Build project'

  - script: |
      echo "Running Cucumber tests with tag: ${{ parameters.cucumberTag }}"
      mvn test -Dcucumber.filter.tags="${{ parameters.cucumberTag }}" -Dcucumber.plugin="json:target/cucumber-report.json"
    displayName: 'Run Cucumber tests and generate JSON report'

  - script: |
      echo Testprojektpfad: %TEST_PROJECT_PATH%
    displayName: 'Show TEST_PROJECT_PATH variable'

  - powershell: |
      if ([string]::IsNullOrEmpty('${{ parameters.runId }}')) {
        $runId = "run-$(Get-Date -Format yyyyMMdd-HHmmss)"
      } else {
        $runId = '${{ parameters.runId }}'
      }
      Write-Host "##vso[task.setvariable variable=RUN_ID]$runId"
      Write-Host "Run ID set to: $runId"
    displayName: 'Set runId to today or from parameter'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/target/cucumber-report.json'
      artifact: 'cucumber-report-$(RUN_ID)'
      publishLocation: 'pipeline'
    displayName: 'Publish Cucumber JSON Report'

