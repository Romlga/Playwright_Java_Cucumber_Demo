parameters:
  - name: cucumberTag
    type: string
    default: '@Teil1'
  - name: runId
    type: string
    default: 'default'

trigger:
  branches:
    include:
      - main
      - masterId_Via_Pipeline

pool:
  name: TeamBank-API-VM-Pool

variables:
  TEST_PROJECT_PATH: 'https://github.com/Romlga/Playwright_Java_Cucumber_Demo'


steps:
  - checkout: self
    displayName: 'Checkout code'

  - script: mvn --version
    displayName: 'Show Maven and Java version'

  - script: mvn clean install -DskipTests
    displayName: 'Build project'

  - script: |
      echo Testprojektpfad: %TEST_PROJECT_PATH%
    displayName: 'Show TEST_PROJECT_PATH variable'

  - powershell: |
      if ('${{ parameters.runId }}' -eq 'default') {
         $runId = "$(Build.BuildId)"
      } else {
        $runId = '${{ parameters.runId }}'
      }
      Write-Host "##vso[task.setvariable variable=RUN_ID]$runId"
      Write-Host "Run ID set to: $runId"
    displayName: 'Set runId from parameter or generate dynamically'

  - script: |
      echo "Running Cucumber tests with tag: ${{ parameters.cucumberTag }}"
      echo "Using masterRunId: $(RUN_ID)"
      mvn test -Dcucumber.filter.tags="${{ parameters.cucumberTag }}" -DmasterRunId=$(RUN_ID) -Dcucumber.plugin="json:target/cucumber-report.json"
    displayName: 'Run Cucumber tests and generate JSON report'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/target/cucumber-report.json'
      artifact: 'cucumber-report-$(Build.BuildId)'
      publishLocation: 'pipeline'
    displayName: 'Publish Cucumber JSON Report'
